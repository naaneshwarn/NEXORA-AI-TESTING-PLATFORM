server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app: unknown paths fall back to index.html
    # so deep links (e.g. /runs/run-abc123) resolve after a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames can be cached aggressively; index.html cannot.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Baseline security headers (the API adds its own on its responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
